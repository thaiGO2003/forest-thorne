name: Close maintainer-verified issues on PR label

# This intentionally runs only after an explicit verified-completion label.
# pull_request_target executes the workflow from the trusted default branch.
on:
  pull_request_target:
    types: [labeled]
    branches: [dev]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  # An Issue can be linked from multiple PRs; serialize the entire workflow.
  group: verified-issue-closure
  queue: max
  cancel-in-progress: false

jobs:
  close-verified-issues:
    if: github.event.label.name == 'issue-verified-complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted automation code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Close explicitly linked, verified issues
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { closeVerifiedIssues } = require('./scripts/github/close-verified-pr-issues.cjs');
            await closeVerifiedIssues({ github, context, core });
